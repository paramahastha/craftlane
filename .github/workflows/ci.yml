name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20.19.0', cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: test -f internal/server/assets/dist/index.html
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./tests/integration
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web exec playwright test --config ../playwright.config.ts
